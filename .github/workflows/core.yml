name: Core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: Linux bridge and build tooling
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Script and documentation checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_docs.py
          python scripts/check_api.py
      - name: Replay pinned upstream patches
        run: python scripts/manage.py prepare
      - name: Test bridge behavior
        run: python scripts/manage.py test --go-root "$(go env GOROOT)"
      - name: Preserve host receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-host-receipt
          path: out/host-tests.json
          if-no-files-found: warn
          retention-days: 14
