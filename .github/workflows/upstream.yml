name: Upstream watch
on:
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-watch
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Track stable releases and mainline drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/upstream.py --issue
